[package]
name = "todo"
version = "0.7.0"
edition = "2024"
rust-version = "1.89"
description = "Concurrency-safe command-line editor for TODO.md task files"
license = "MIT"
repository = "https://github.com/reynanTandoyo/todo"
publish = false

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
clap_complete = { version = "4.6.11", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
similar = "3.2.1"
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }

# Stopping the processes a `verify` command starts (R-VERIFY-1, T-172). Both crates are already in
# Cargo.lock; these lines only make them direct, in the target where each one is used.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json"] }
predicates = "3.1.4"
proptest = "1.12.0"
tempfile = "3.27.0"

[features]
# Test-only hooks (pausing while holding the lock, overriding the clock). Never enabled in release builds.
test-hooks = []

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
# Line tables only: backtraces keep file and line, debug files stay small (the build cache reached 11 GB).
debug = "line-tables-only"
