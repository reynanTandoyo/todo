[package]
name = "todo"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Concurrency-safe command-line editor for TODO.md task files"
license = "MIT"
publish = false

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.1"
toml = "1.2.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json"] }
predicates = "3.1.4"
proptest = "1.12.0"
tempfile = "3.27.0"

[features]
# Test-only hooks (pausing while holding the lock, overriding the clock). Never enabled in release builds.
test-hooks = []

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
